name: GitGecko deep black-box benchmark v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gitgecko-deep-bench-v2-${{ github.event.pull_request.number }}-${{ github.sha }}
  cancel-in-progress: true

env:
  GITGECKO_SPEC: gitgecko@latest
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""
  GITGECKO_LOCAL_BASE_URL: ""
  npm_config_update_notifier: "false"
  npm_config_fund: "false"
  npm_config_audit: "false"

jobs:
  core-contract-and-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.19.0"
      - name: Probe rule quality, argument handling, file scope, and diff parsing
        shell: bash
        run: node .gitgecko-bench/core-probe.mjs | tee "$RUNNER_TEMP/core-probe.json"

  model-output-and-cloud-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.19.0"
      - name: Probe model parsing, retries, data egress, device auth, hosted review, history, and logout
        shell: bash
        run: node .gitgecko-bench/model-and-cloud-probe.mjs | tee "$RUNNER_TEMP/model-cloud-probe.json"

  runtime-check-security:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.19.0"
      - name: Probe runtime-check redaction, bounds, timeout, shell, and batch atomicity
        shell: bash
        run: node .gitgecko-bench/runtime-probe.mjs | tee "$RUNNER_TEMP/runtime-probe.json"

  installed-agent-pathway:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.19.0"
      - name: Probe installed Codex selection, permissions, output parsing, failures, and timeout
        shell: bash
        run: node .gitgecko-bench/native-probe.mjs | tee "$RUNNER_TEMP/native-probe.json"

  scale-package-and-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.19.0"
      - name: Benchmark registry artifact, cold/warm startup, findings, bytes, memory, and concurrency
        shell: bash
        run: node .gitgecko-bench/bench-probe.mjs | tee "$RUNNER_TEMP/bench-probe.json"

  cross-platform-release:
    name: cross-platform-release (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.19.0"
      - name: Probe released CLI on the platform
        shell: bash
        run: node .gitgecko-bench/platform-probe.mjs | tee "$RUNNER_TEMP/platform-probe.json"

  node-resolution-boundary:
    name: node-resolution (${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: ["20.19.0", "22.18.0", "22.19.0", "24.x"]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
      - name: Resolve plain, latest, and strict release channels from isolated caches
        shell: bash
        run: |
          set -uo pipefail
          echo "node=$(node --version) npm=$(npm --version)"
          npm view gitgecko version dist-tags engines --json
          index=0
          for spec in gitgecko gitgecko@latest; do
            index=$((index + 1))
            export HOME="$RUNNER_TEMP/home-$index"
            export npm_config_cache="$RUNNER_TEMP/cache-$index"
            mkdir -p "$HOME"
            echo "===== advisory npx $spec version ====="
            set +e
            npm_config_engine_strict=false npx --yes "$spec" version > "$RUNNER_TEMP/advisory-$index.out" 2> "$RUNNER_TEMP/advisory-$index.err"
            code=$?
            set -e
            echo "exit=$code"
            cat "$RUNNER_TEMP/advisory-$index.out"
            cat "$RUNNER_TEMP/advisory-$index.err"
          done
          export HOME="$RUNNER_TEMP/home-strict"
          export npm_config_cache="$RUNNER_TEMP/cache-strict"
          mkdir -p "$HOME"
          echo "===== strict npx gitgecko@latest version ====="
          set +e
          npm_config_engine_strict=true npx --yes gitgecko@latest version > "$RUNNER_TEMP/strict.out" 2> "$RUNNER_TEMP/strict.err"
          strict_code=$?
          set -e
          echo "exit=$strict_code"
          cat "$RUNNER_TEMP/strict.out"
          cat "$RUNNER_TEMP/strict.err"

  website-onboarding-and-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.19.0"
      - name: Crawl links, benchmark routes, inspect TLS, metadata, commands, and security headers
        shell: bash
        run: node .gitgecko-bench/website-probe.mjs | tee "$RUNNER_TEMP/website-probe.json"
