name: GitGecko local model pathway probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  openai-compatible-local-route:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""
      GITGECKO_LOCAL_BASE_URL: ""
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.19.0"
      - name: Configure, discover, diagnose, and review through a real local HTTP transport
        shell: bash
        run: bash .gitgecko-e2e/local-model-probe.sh
