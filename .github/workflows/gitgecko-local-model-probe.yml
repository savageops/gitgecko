name: GitGecko local model pathway probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  openai-compatible-local-route:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""
      GITGECKO_LOCAL_BASE_URL: ""
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.19.0"
      - name: Configure, discover, diagnose, and review through a real local HTTP transport
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home"
          export npm_config_cache="$RUNNER_TEMP/npm-cache"
          mkdir -p "$HOME" "$RUNNER_TEMP/repo" "$RUNNER_TEMP/mock"

          cat > "$RUNNER_TEMP/mock/server.mjs" <<'JS'
          import http from 'node:http';
          import fs from 'node:fs';

          const port = 18765;
          const logPath = process.env.MOCK_LOG;
          const append = (value) => fs.appendFileSync(logPath, `${JSON.stringify(value)}\n`);
          const server = http.createServer(async (req, res) => {
            const chunks = [];
            for await (const chunk of req) chunks.push(chunk);
            const raw = Buffer.concat(chunks).toString('utf8');
            let body;
            try { body = raw ? JSON.parse(raw) : undefined; } catch { body = raw; }
            append({ method: req.method, url: req.url, authorization: req.headers.authorization ?? null, body });

            if (req.method === 'GET' && (req.url === '/v1/models' || req.url === '/models')) {
              res.writeHead(200, { 'content-type': 'application/json' });
              res.end(JSON.stringify({ data: [{
                id: 'gitgecko-e2e-model', object: 'model', owned_by: 'local', name: 'GitGecko E2E Model',
                protocols: ['openai-chat-completions'], capabilities: { text: true, tools: false, reasoning: false, streaming: true }
              }] }));
              return;
            }

            if (req.method === 'POST' && (req.url === '/v1/chat/completions' || req.url === '/chat/completions')) {
              const text = '[mock-model] Semantic review completed through the configured OpenAI-compatible endpoint.';
              const first = {
                id: 'chatcmpl-gitgecko-e2e', object: 'chat.completion.chunk', created: 1,
                model: 'gitgecko-e2e-model', choices: [{ index: 0, delta: { role: 'assistant', content: text }, finish_reason: null }]
              };
              const done = {
                id: 'chatcmpl-gitgecko-e2e', object: 'chat.completion.chunk', created: 1,
                model: 'gitgecko-e2e-model', choices: [{ index: 0, delta: {}, finish_reason: 'stop' }],
                usage: { prompt_tokens: 10, completion_tokens: 8, total_tokens: 18 }
              };
              res.writeHead(200, { 'content-type': 'text/event-stream', 'cache-control': 'no-cache' });
              res.end(`data: ${JSON.stringify(first)}\n\ndata: ${JSON.stringify(done)}\n\ndata: [DONE]\n\n`);
              return;
            }

            res.writeHead(404, { 'content-type': 'application/json' });
            res.end(JSON.stringify({ error: { message: `No mock route for ${req.method} ${req.url}` } }));
          });
          server.listen(port, '127.0.0.1', () => {
            fs.writeFileSync(process.env.MOCK_READY, 'ready');
            console.log(`mock model listening on ${port}`);
          });
          JS

          export MOCK_LOG="$RUNNER_TEMP/mock/requests.ndjson"
          export MOCK_READY="$RUNNER_TEMP/mock/ready"
          node "$RUNNER_TEMP/mock/server.mjs" > "$RUNNER_TEMP/mock/server.out" 2> "$RUNNER_TEMP/mock/server.err" &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do
            test -f "$MOCK_READY" && break
            sleep 0.1
          done
          test -f "$MOCK_READY"

          cd "$RUNNER_TEMP/repo"
          git init -q
          git config user.name "GitGecko E2E"
          git config user.email "e2e@gitgecko.invalid"
          printf 'export const safe = true;\n' > app.ts
          git add app.ts
          git commit -qm baseline
          cat > app.ts <<'TS'
          export function execute(expression: string): unknown {
            return eval(expression);
          }
          TS

          npx --yes gitgecko models configure \
            --base-url http://127.0.0.1:18765/v1 \
            --model gitgecko-e2e-model \
            --protocol openai-chat-completions \
            > "$RUNNER_TEMP/configure.out"
          npx --yes gitgecko models show > "$RUNNER_TEMP/show.out"
          npx --yes gitgecko models > "$RUNNER_TEMP/models.out"
          npx --yes gitgecko doctor > "$RUNNER_TEMP/doctor.out"

          echo "===== configure ====="; cat "$RUNNER_TEMP/configure.out"
          echo "===== show ====="; cat "$RUNNER_TEMP/show.out"
          echo "===== models ====="; cat "$RUNNER_TEMP/models.out"
          echo "===== doctor ====="; cat "$RUNNER_TEMP/doctor.out"

          grep -q '127.0.0.1:18765/v1' "$RUNNER_TEMP/show.out"
          grep -q 'gitgecko-e2e-model' "$RUNNER_TEMP/models.out"
          grep -qi 'configured' "$RUNNER_TEMP/doctor.out"

          set +e
          npx --yes gitgecko review --pathway pi --json > "$RUNNER_TEMP/pi.json" 2> "$RUNNER_TEMP/pi.err"
          pi_code=$?
          npx --yes gitgecko review --pathway auto --json > "$RUNNER_TEMP/auto.json" 2> "$RUNNER_TEMP/auto.err"
          auto_code=$?
          npx --yes gitgecko ask "Does the configured local route answer?" --pathway pi --json > "$RUNNER_TEMP/ask.json" 2> "$RUNNER_TEMP/ask.err"
          ask_code=$?
          set -e

          echo "exit pi=$pi_code auto=$auto_code ask=$ask_code"
          test "$pi_code" -eq 1
          test "$auto_code" -eq 1
          test "$ask_code" -eq 0
          test ! -s "$RUNNER_TEMP/pi.err"
          test ! -s "$RUNNER_TEMP/auto.err"
          test ! -s "$RUNNER_TEMP/ask.err"

          node - <<'NODE'
          const fs = require('node:fs');
          for (const name of ['pi', 'auto']) {
            const value = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/${name}.json`, 'utf8'));
            if (value.success !== true) throw new Error(`${name}: provider-backed review failed`);
            if (value.pathwayResolution?.family !== 'local') throw new Error(`${name}: did not resolve local pathway`);
            if (!value.output.includes('[mock-model]')) throw new Error(`${name}: model response missing`);
            if (!value.artifact?.findings?.some((finding) => finding.ruleId === 'baseline-no-eval')) throw new Error(`${name}: deterministic evidence missing`);
            if (value.artifact.mergeable !== false) throw new Error(`${name}: deterministic blocker did not gate mergeability`);
            console.log(name, JSON.stringify({ pathway:value.pathwayResolution, output:value.output, findings:value.artifact.findings.map(f=>f.ruleId), mergeable:value.artifact.mergeable }));
          }
          const ask = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/ask.json`, 'utf8'));
          if (!ask.success || !ask.output.includes('[mock-model]') || ask.pathwayResolution?.family !== 'local') throw new Error('ask did not use configured local model');
          console.log('ask', JSON.stringify({pathway:ask.pathwayResolution, output:ask.output}));
          NODE

          echo "===== mock HTTP requests ====="
          cat "$MOCK_LOG"
          node - <<'NODE'
          const fs = require('node:fs');
          const requests = fs.readFileSync(process.env.MOCK_LOG, 'utf8').trim().split('\n').map(JSON.parse);
          const modelList = requests.find((request) => request.method === 'GET' && request.url.endsWith('/models'));
          const completions = requests.filter((request) => request.method === 'POST' && request.url.endsWith('/chat/completions'));
          if (!modelList) throw new Error('model discovery did not reach the configured endpoint');
          if (completions.length !== 3) throw new Error(`expected 3 model calls, got ${completions.length}`);
          if (completions.some((request) => request.authorization !== 'Bearer local')) throw new Error('local compatibility credential contract changed');
          if (completions.some((request) => request.body?.model !== 'gitgecko-e2e-model')) throw new Error('configured model id not sent');
          if (completions.some((request) => request.body?.stream !== true)) throw new Error('streaming contract not used');
          NODE
