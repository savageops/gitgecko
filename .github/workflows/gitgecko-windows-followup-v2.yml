name: GitGecko Windows follow-up v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  native-windows-contract:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.19.0"
      - name: Exercise native PowerShell and Windows path handling
        shell: pwsh
        run: ./.gitgecko-bench/windows-followup.ps1
      - name: Upload Windows follow-up evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-followup
          path: ${{ runner.temp }}/windows-followup.json
          if-no-files-found: warn
          retention-days: 1
