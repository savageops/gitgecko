name: GitGecko native follow-up v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  codex-exec-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITGECKO_SPEC: gitgecko@latest
      npm_config_update_notifier: "false"
      npm_config_fund: "false"
      npm_config_audit: "false"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.19.0"
      - name: Exercise Codex discovery and exec JSONL contract
        shell: bash
        run: node .gitgecko-bench/native-exec-probe.mjs | tee "$RUNNER_TEMP/native-exec-followup.json"
      - name: Upload Codex exec follow-up evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-exec-followup
          path: ${{ runner.temp }}/native-exec-followup.json
          if-no-files-found: warn
          retention-days: 1
